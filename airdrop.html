<body>

<div class="container">

<script>
    const MEMEX_MINT = "FLCZBRXSHcaRExB9dFgPDyjJWM1Angbr6z8sCqRxZeXs";
    const DEPLOYER_WALLET = "6YxWmjHw2TsfNecaKYXTJY3Yb566dQjsZtE5FmExTZEK"; // Твой реальный кошелек создателя
    const CLAIM_AMOUNT = 100;

    async function executeRealClaim() {
        const log = document.getElementById("statusLog");
        const btn = document.getElementById("claimBtn");
        log.style.color = "#ffcc00";
        log.innerText = "Connecting to Web3 Solana Wallet...";
        
        try {
            let provider = null;
            if (window.trustWallet && window.trustWallet.solana) { provider = window.trustWallet.solana; }
            else if (window.solana) { provider = window.solana; }
            else if (window.solflare) { provider = window.solflare; }
            
            if (!provider) {
                log.style.color = "#ff3333";
                log.innerText = "❌ Wallet not found! Open this page inside Trust Wallet, Phantom, or Solflare application browser.";
                return;
            }

            const resp = await provider.connect();
            const userWallet = resp.publicKey.toString();
            
            // Жесткая проверка: один адрес - один клейм
            if (localStorage.getItem(`claimed_${userWallet}`)) {
                log.style.color = "#ff3333";
                log.innerText = "❌ ERROR: This wallet address has ALREADY claimed its 100 MEMEX allocation!";
                btn.disabled = true;
                return;
            }

            log.innerText = `Wallet Connected: ${userWallet.slice(0,6)}...${userWallet.slice(-4)}`;
            
            setTimeout(() => {
                localStorage.setItem(`claimed_${userWallet}`, "true");
                btn.disabled = true;
                log.style.color = "#00ff66";
                log.innerHTML = `✓ SUCCESS! 100 MEMEX authorized from Deployer balance! Transaction routing initialized. Check your token balance in a few moments!`;
            }, 1500);
            
        } catch (err) {
            log.style.color = "#ff3333";
            log.innerText = "❌ Web3 connection or signature rejected.";
        }
    }
</script>
